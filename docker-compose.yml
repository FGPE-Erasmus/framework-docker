version: '3.7'

services:

  # AUTHENTICATION / AUTHORIZATION
  keycloak:
    image: fgpe/keycloak:latest
    env_file: ./keycloak/.env
    restart: unless-stopped
    ports:
      - 8081:8080
    volumes:
      - ./keycloak/fgpe-realm.json:/tmp/fgpe-realm.json
      - ./keycloak/profile.properties:/opt/jboss/keycloak/standalone/configuration/profile.properties
    depends_on:
      - keycloak-postgres
    networks:
      - fgpe-nw

  keycloak-postgres:
    image: postgres:11-alpine
    env_file: ./keycloak/postgres/.env
    restart: unless-stopped
    volumes:
      - ./data/keycloak/postgres:/var/lib/postgresql/data
    networks:
      - fgpe-nw

  # MOODLE
  lti-db:
    image: mongo:latest
    env_file: ./moodle/.env
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${LTI_TOOL_DB_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${LTI_TOOL_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${LTI_TOOL_DB_PASSWORD}
    volumes:
      - lti-data:/data/db
    depends_on:
      - moodle
    networks:
      - fgpe-nw

  moodle:
    image: fgpe/moodle
    env_file: ./moodle/.env
    restart: unless-stopped
    environment:
      SITE_URL: ${MOODLE_URL}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME}
      MOODLE_EMAIL: ${MOODLE_EMAIL}
      MOODLE_USERNAME: ${MOODLE_USERNAME}
      MOODLE_PASSWORD: ${MOODLE_PASSWORD}
      REVERSEPROXY: "true"
      DB_TYPE: pgsql
      DB_HOST: moodle-db
      DB_PORT: 5432
      DB_NAME: ${MOODLE_DB_NAME}
      DB_USER: ${MOODLE_DB_USER}
      DB_PASS: ${MOODLE_DB_PASSWORD}
      ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - '8180:8080'
      - '8444:8443'
    volumes:
      - moodle-data:/var/www/moodledata
    depends_on:
      - moodle-db
    networks:
      - fgpe-nw

  moodle-db:
    image: postgres:alpine
    env_file: ./moodle/.env
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MOODLE_DB_NAME}
      POSTGRES_USER: ${MOODLE_DB_USER}
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD}
    volumes:
      - ./data/moodle/db:/var/lib/postgresql/data
    networks:
      - fgpe-nw

  # MAILING
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - 8025:8025
    networks:
      - fgpe-nw

  # AUTHORKIT
  authorkit-api:
    image: fgpe/authorkit-api:latest
    env_file: ./authorkit/.env
    restart: unless-stopped
    depends_on:
      - authorkit-postgres
      - authorkit-redis
    ports:
      - 8082:3000
    networks:
      - fgpe-nw

  authorkit-postgres:
    image: postgres:11-alpine
    env_file: ./authorkit/postgres/.env
    restart: unless-stopped
    volumes:
      - ./data/authorkit/postgres:/var/lib/postgresql/data
    networks:
      - fgpe-nw

  authorkit-redis:
    image: redis:latest
    env_file: ./authorkit/redis/.env
    restart: unless-stopped
    volumes:
      - ./authorkit/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/authorkit/redis/data:/data
    networks:
      - fgpe-nw

  authorkit-ui:
    image: fgpe/authorkit-ui:latest
    restart: unless-stopped
    volumes:
      - ./authorkit/ui/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 8083:80
    networks:
      - fgpe-nw

  # GAMIFICATION SERVICE
  gamification-service:
    image: fgpe/gamification-service:latest
    env_file: ./gamification-service/.env
    restart: unless-stopped
    depends_on:
      - gamification-service-mongodb
      - gamification-service-redis
      - evaluation-engine
    ports:
      - 8084:3000
    networks: 
      - fgpe-nw

  gamification-service-mongodb:
    image: mongo:latest
    env_file: ./gamification-service/mongodb/.env
    restart: unless-stopped
    volumes:
      - ./data/gamification-service/mongodb/data:/data/db
    networks:
      - fgpe-nw

  gamification-service-redis:
    image: redis:latest
    env_file: ./gamification-service/redis/.env
    restart: unless-stopped
    volumes:
      - ./gamification-service/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/gamification-service/redis/data:/data
    networks:
      - fgpe-nw

  # EVALUATION ENGINE SERVICE
  evaluation-engine:
    image: jcpaiva/mooshak-fgpe
    restart: unless-stopped
    volumes:
      - mooshak-data:/home/mooshak/data
    ports:
      - 8085:80
    networks:
      - fgpe-nw

  # PROGRAMMING LEARNING PLATFORM
  learning-platform:
    image: fgpe/learning-platform
    restart: unless-stopped
    volumes:
      - ./learning-platform/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 8086:80
    networks:
      - fgpe-nw

volumes:
  mooshak-data:
  lti-data:
  moodle-data:

networks:
  fgpe-nw:
